name: Unit Tests

on:
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run TypeScript type check
        run: bun run ts

      # Linting is intentionally skipped in CI pending a cleanup of
      # pre-existing violations surfaced after the flat-config migration.
      # Re-enable once `bun run lint` is clean on main.

      - name: Run tests
        run: bun run test:int
