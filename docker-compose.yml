version: '3'

services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app
    command: sh -c "bun install && bun dev"
    depends_on:
      - mongo
    env_file:
      - .env

  mongo:
    image: mongo:8.2
    ports:
      - '27017:27017'
    volumes:
      - data:/data/db
    env_file:
      - .env

volumes:
  data:
  node_modules:
